<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14120d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Triage — adaptive study scheduler</title>

<link rel="manifest" href='data:application/manifest+json,{"name":"Triage","short_name":"Triage","start_url":".","scope":".","display":"standalone","background_color":"%23ffffff","theme_color":"%23ffd60a"}'>

<style>
/* Gold = winning. Full light palette on bare :root; dark redefines tokens only
   (media-guarded for the system default + [data-theme] blocks for explicit choice). */
:root {
  --bg: #ffffff; --panel: #ffffff; --chip: #fef3c7; --ink: #1b1a12; --muted: #706c5e;
  --line: #eee6cc; --accent: #ffd60a; --accent-deep: #ca8a04; --accent-ink: #201a02;
  --warn: #c2410c; --good: #16a34a; --danger: #dc2626; --learn: #2563eb;
  --shadow: 0 1px 2px rgba(170, 125, 0, .08), 0 8px 24px rgba(170, 125, 0, .09);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14120d; --panel: #1e1b12; --chip: #2a2617; --ink: #f2ede0; --muted: #a69c86;
    --line: #332d1c; --accent: #fcd34d; --accent-deep: #fcd34d; --accent-ink: #1d1607;
    --warn: #fb923c; --good: #4ade80; --danger: #f87171; --learn: #60a5fa; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #14120d; --panel: #1e1b12; --chip: #2a2617; --ink: #f2ede0; --muted: #a69c86;
  --line: #332d1c; --accent: #fcd34d; --accent-deep: #fcd34d; --accent-ink: #1d1607;
  --warn: #fb923c; --good: #4ade80; --danger: #f87171; --learn: #60a5fa; --shadow: none;
}
/* one colour per subject, used on block edges and progress bars */
[data-subject="math"] { --sc: #6366f1; } [data-subject="phys"] { --sc: #0ea5e9; }
[data-subject="econ"] { --sc: #10b981; } [data-subject="peak"] { --sc: #f59e0b; }
[data-subject="chem"] { --sc: #a855f7; } [data-subject="sat"]  { --sc: #ec4899; }
[data-subject="eng"]  { --sc: #14b8a6; } [data-subject="port"] { --sc: #f97316; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 Inter, system-ui, -apple-system, sans-serif; padding-bottom: 82px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
h2 { font: 600 12px 'Space Grotesk', Inter, sans-serif; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted); margin: 22px 2px 8px; }

#top { display: flex; align-items: baseline; justify-content: space-between;
  max-width: 560px; margin: 0 auto; padding: 16px 16px 4px; }
.brand { font: 700 22px 'Space Grotesk', sans-serif; letter-spacing: -.02em; padding: 0 5px;
  background: linear-gradient(transparent 58%, var(--accent) 58%, var(--accent) 92%, transparent 92%); }
.sub { font: 700 11.5px 'Space Grotesk', sans-serif; color: var(--accent-deep); letter-spacing: .1em; }
#view { max-width: 560px; margin: 0 auto; padding: 0 14px 24px; }

#tabs { position: fixed; bottom: 0; left: 0; right: 0; display: flex; z-index: 5;
  background: var(--panel); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom); }
#tabs button { flex: 1; padding: 15px 0 13px; font: 600 14px 'Space Grotesk', sans-serif;
  color: var(--muted); letter-spacing: .04em; }
#tabs button.active { color: var(--ink); background:
  linear-gradient(to bottom, var(--accent) 4px, transparent 4px); }

.day-nav { display: flex; align-items: center; gap: 6px; margin: 8px 0 4px; }
.day-nav button { width: 48px; height: 44px; font-size: 24px; color: var(--accent-deep);
  border-radius: 12px; }
.day-nav button:active { background: var(--chip); }
#day-label { flex: 1; text-align: center; font: 600 17px 'Space Grotesk', sans-serif; }
#day-label .today-mark { color: var(--accent-deep); }
.daytag { display: inline-block; font: 700 11px 'Space Grotesk', sans-serif; color: var(--accent-ink);
  background: var(--accent); border-radius: 99px; padding: 2px 9px; vertical-align: 2px; }
.goalbar { text-align: center; font: 600 12.5px 'Space Grotesk', sans-serif;
  color: var(--muted); letter-spacing: .03em; margin: 0 0 2px; }
.goalbar b { color: var(--accent-deep); font-size: 13.5px; }
.daysum { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.warn { color: var(--warn); }

.block { position: relative; background: var(--panel); border: 1px solid var(--line);
  border-left: 5px solid var(--sc, var(--line)); border-radius: 14px;
  padding: 12px 58px 12px 14px; margin: 10px 0; box-shadow: var(--shadow); }
.b-time { font: 600 12px 'Space Grotesk', sans-serif; color: var(--muted); letter-spacing: .05em; }
.b-title { font: 600 16px/1.35 'Space Grotesk', sans-serif; margin: 2px 0; }
.b-instr { color: var(--muted); font-size: 13.5px; }
.b-reason { display: inline-block; margin-top: 7px; font-size: 11.5px; font-weight: 600;
  color: var(--warn); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; }
.tickwrap { position: absolute; top: 0; right: 0; bottom: 0; width: 54px;
  display: flex; align-items: center; justify-content: center; cursor: pointer; }
input.tick { width: 26px; height: 26px; accent-color: var(--accent); }
.block.done .b-title, .block.done .b-instr { text-decoration: line-through; opacity: .5; }
.block.kind-soccer, .block.kind-recall, .block.kind-errlog { background: transparent;
  border-style: dashed; border-left-width: 1px; box-shadow: none; }
.block.kind-soccer .b-title { color: var(--muted); }
.block.now { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.block.now .b-time { color: var(--accent-deep); }

.weektotal { text-align: center; font-size: 12.5px; color: var(--muted);
  padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.weektotal b { color: var(--accent-deep); }
.pomo-btn { margin-top: 7px; font: 700 11px 'Space Grotesk', sans-serif; color: var(--accent-deep);
  border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; }
#pomobar[hidden] { display: none; }
#pomobar { position: fixed; left: 0; right: 0; z-index: 6;
  bottom: calc(49px + env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 8px; padding: 10px 14px;
  background: var(--accent); color: var(--accent-ink);
  font: 700 14px 'Space Grotesk', sans-serif; }
#pomobar .pomo-label { flex: 1; font: 500 12px Inter, sans-serif; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
#pomo-stop { border: 2px solid var(--accent-ink); color: var(--accent-ink);
  border-radius: 99px; padding: 2px 12px; font: 700 12px 'Space Grotesk', sans-serif; }
.bar-row { margin: 10px 0; }
.bar-top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 4px; }
.bar-top .warn { color: var(--warn); font-weight: 700; }
.bar { height: 10px; background: var(--chip); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--sc, var(--accent)); border-radius: 99px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px; margin: 10px 0; box-shadow: var(--shadow); }
form.card { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
form.card .wide, form.card button { grid-column: 1 / -1; }
input, select { background: var(--bg); color: var(--ink); border: 1px solid var(--line);
  border-radius: 9px; padding: 10px 11px; font: inherit; width: 100%; }
.primary { background: var(--accent); color: var(--accent-ink); border-radius: 10px;
  padding: 13px; font: 700 14px 'Space Grotesk', sans-serif; letter-spacing: .03em; }
.primary:active { filter: brightness(.92); }
.toggles label { display: flex; align-items: center; gap: 10px; padding: 10px 2px; font-weight: 500; }
.toggles input { width: 22px; height: 22px; accent-color: var(--accent); }

.chip, .topic { display: inline-block; border: 1px solid var(--line); background: var(--chip);
  border-radius: 99px; padding: 7px 12px; margin: 3px 2px; font-size: 12.5px; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  font-weight: 600; }
.chip-dt { font-size: 11px; font-weight: 700; border: 1px solid var(--line);
  border-radius: 99px; padding: 1px 7px; color: var(--muted); }
.chip-dt.warn { border-color: var(--warn); }
.datarow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.filebtn { display: block; text-align: center; border: 2px solid var(--accent);
  border-radius: 10px; padding: 10px; font: 700 14px 'Space Grotesk', sans-serif;
  color: var(--accent-deep); cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent-deep); outline-offset: 2px; }
.item { display: flex; align-items: center; gap: 8px; padding: 9px 2px;
  border-bottom: 1px solid var(--line); font-size: 13.5px; }
.item:last-child { border-bottom: 0; }
.item .grow { flex: 1; }
.item .note { color: var(--muted); }
.del { color: var(--danger); font-size: 17px; width: 36px; height: 36px; border-radius: 9px; }
.del:active { background: var(--chip); }

details.subject { background: var(--panel); border: 1px solid var(--line);
  border-left: 5px solid var(--sc, var(--line)); border-radius: 14px; margin: 10px 0;
  box-shadow: var(--shadow); }
details.subject summary { list-style: none; display: flex; justify-content: space-between;
  align-items: center; gap: 8px; padding: 13px 14px; cursor: pointer;
  font: 600 15px 'Space Grotesk', sans-serif; }
summary::-webkit-details-marker { display: none; }
.counts { font: 500 11.5px Inter, sans-serif; color: var(--muted); text-align: right; }
.topics { padding: 2px 10px 12px; }
.topic.st-learning { color: var(--learn); border-color: var(--learn); background: transparent; }
.topic.st-shaky { color: var(--warn); border-color: var(--warn); background: transparent; }
.topic.st-solid { color: var(--good); border-color: var(--good); background: transparent; }
.empty { color: var(--muted); text-align: center; padding: 18px 0; }
</style>
</head>

<script>

      'Supply & its determinants', 'Market equilibrium & allocative efficiency', 'Elasticities: PED & YED',

      'Market failure: externalities', 'Market failure: public goods & common pool resources',
      'Market power: monopoly & oligopoly (HL)', 'Behavioural economics & rational choice (HL)',
      'Measuring economic activity: GDP & GNI', 'Aggregate demand & aggregate supply',
      'Macroeconomic objectives: growth, unemployment & inflation', 'Inequality & poverty',
      'Demand-side policies: fiscal & monetary', 'Supply-side policies',
      'International trade & comparative advantage', 'Trade protection: tariffs, quotas & subsidies',
      'Exchange rates & the balance of payments', 'Economic development: measures & strategies'
    ],
    eng: [
      'Paper 1: guided analysis of unseen prose', 'Paper 1: guided analysis of unseen poetry',
      'Paper 1: thesis & structure under time', 'Paper 2: comparative essay planning',
      'Paper 2: works — themes & evidence bank', 'Individual Oral: global issue & extract choice',
      'Individual Oral: 10-minute delivery practice', 'Literary devices & assessment criteria'
    ],
    port: [
      'Paper 1: análise orientada de prosa', 'Paper 1: análise orientada de poesia',
      'Paper 1: tese e estrutura sob tempo', 'Paper 2: planejamento de ensaio comparativo',
      'Paper 2: obras — temas e evidências', 'Oral Individual: questão global e trechos',
      'Oral Individual: prática de apresentação', 'Recursos literários e critérios de avaliação'
    ],
    sat: [
      'R&W: Information & Ideas', 'R&W: Craft & Structure', 'R&W: Expression of Ideas',
      'R&W: Standard English Conventions', 'Math: Algebra', 'Math: Advanced Math',
      'Math: Problem-Solving & Data Analysis', 'Math: Geometry & Trigonometry'
    ],
    peak: [
      'Product: build & ship', 'Growth: distribution & users', 'Content: question bank & guides', 'Ops: feedback & metrics'
    ]
  };

  function seedState() {
    var topics = [];
    SUBJECTS.forEach(function (s) {
      TOPICS[s.id].forEach(function (name, i) {
        topics.push({ id: s.id + '-' + (i + 1), subjectId: s.id, name: name, status: 'new', lastStudied: null, reviewDue: null });
      });

    return {
      version: 1,
      settings: { floorMode: false, satDone: false, satTarget: 1600, satDeadline: '2026-12-18' },
      subjects: SUBJECTS.map(function (s) { return Object.assign({}, s, { sources: s.sources.slice() }); }),

/* engine.js — pure scheduling logic. No DOM. UMD: node module + browser global. */

  if (typeof module !== 'undefined' && module.exports) module.exports = factory();
  else root.Engine = factory();
})(typeof self !== 'undefined' ? self : this, function () {

  var TIER_W = { 1: 1, 2: 0.72, 3: 0.45 };
  // weekend deep-work bias: math ≈ physics on top, econ next, chem last

  var WEEKEND_W = { math: 1.45, phys: 1.45, econ: 1.15, chem: 0.8 };
  var KIND = { math: 'analytical', phys: 'analytical', chem: 'analytical', peak: 'project', sat: 'project' };
  // [multiplier on the first flex block of the day, multiplier on the last]
  var PLACEMENT = { analytical: [1.35, 0.75], project: [0.60, 1.40], neutral: [1, 1] };
  var DAY_CAP = 150, SPREAD = 90;

  // ---- dates (all ISO yyyy-mm-dd, UTC arithmetic, weeks start Monday) ----

  function addDays(iso, n) { return toISO(fromISO(iso) + n * 864e5); }

  var ANCHOR_MONDAY = '2026-08-24'; // this Monday was a Day 1 (Tue 2026-08-25 was a Day 2)
  var CLASS_DAYS = { 1: ['eng', 'econ', 'math'], 2: ['chem', 'port', 'phys'] };
  function schoolDay(iso) {
    if (dow(iso) > 4) return null;
    var days = daysBetween(ANCHOR_MONDAY, iso), w = Math.floor(days / 7);
    var idx = w * 5 + Math.min(days - w * 7, 4); // school days elapsed since the anchor

  // nearest test still ahead of tonight's study blocks; a test sat earlier today
  // (dt = 0) is over and must not shadow the next one

    var best = null;
    state.tests.forEach(function (t) {

  // days since this subject last appeared in the log (capped; never-studied = max)

  function subjectWeight(state, subject, dateISO) {

    state.grades.forEach(function (g) {

    gradeMult = Math.min(2.6, gradeMult);

    // day-of gets neither boost nor prep: by study time the test has been sat
    var testMult = testDt === null || testDt < 1 ? 1 :
      testDt <= 2 ? 3.0 : testDt <= 5 ? 2.2 : testDt <= 10 ? 1.6 : testDt <= 14 ? 1.25 : 1;

    var total = 0, shaky = 0;
    state.topics.forEach(function (tp) {
      if (tp.subjectId !== subject.id) return;
      total++; if (tp.status === 'shaky') shaky++;

    var shakyMult = 1 + 0.5 * (total ? shaky / total : 0);

    var sd = schoolDay(dateISO); // consolidate what was taught in class today

    var wkndMult = dow(dateISO) >= 5 ? (WEEKEND_W[subject.id] || 1) : 1;
    // untouched subjects build pressure, so small-budget subjects still surface
    var staleMult = 1 + 0.15 * staleDays(state, subject.id, dateISO);
    var effWeight = TIER_W[subject.tier] * (subject.priority || 1); // e.g. chem: 0.72 × 1.25
    var target = subject.weeklyMinutes + remedial + prep; // assessments add minutes, like grades do

      '<select name="score" required>' + [7, 6, 5, 4, 3, 2, 1].map(function (n) {
        return '<option value="' + n + '">' + n + ' / 7</option>'; }).join('') + '</select>' +
      '<input name="date" type="date" value="' + today + '" required>' +
      '<input name="note" placeholder="What was it? (optional)">' +
      '<button class="primary" type="submit">Add grade</button></form>' +
      '<div id="grade-list" class="card">' + grades + '</div>' +
      '<h2>Upcoming tests</h2><form id="test-form" class="card">' +
      '<select name="subject" required>' + opts('') + '</select>' +
      '<input name="date" type="date" value="' + today + '" required>' +
      '<input name="note" class="wide" placeholder="Paper / scope (optional)">' +
      '<div class="wide" id="test-topics">' + chipsFor(state.subjects[0].id) + '</div>' +
      '<button class="primary" type="submit">Add test</button></form>' +
      '<div id="test-list" class="card">' + tests + '</div>' +
      '<h2>Modes</h2><div class="card toggles">' +
      '<label><input type="checkbox" id="floor-toggle"' + (state.settings.floorMode ? ' checked' : '') +
      '> Floor mode — a bad day still gets its 25 minutes</label>' +
      '<label><input type="checkbox" id="sat-toggle"' + (state.settings.satDone ? ' checked' : '') +
      '> SAT done — hand its hours back to the IB</label></div>' +
      '<h2>Data</h2><div class="card datarow">' +
      '<button class="primary" type="button" id="export-btn">Export backup</button>' +
      '<label class="filebtn">Import backup<input type="file" id="import-file" accept=".json,application/json" hidden></label></div>';
  }

  function renderSubjects(openIds) {
    return state.subjects.map(function (s) {
      var mine = state.topics.filter(function (t) { return t.subjectId === s.id; });
      var counts = ORDER.map(function (st) {
        var n = mine.filter(function (t) { return t.status === st; }).length;
        if (!n) return null;
        return st === 'shaky' ? '<span class="warn">' + n + ' shaky</span>' : n + ' ' + st;
      }).filter(Boolean).join(' · ');
      var gr = state.grades.filter(function (g) { return g.subjectId === s.id; })
        .sort(function (a, b) { return a.date < b.date ? 1 : -1; }).slice(0, 2)
        .map(function (g) { return g.score; });
      if (gr.length) counts = 'grades ' + gr.join('·') + ' · ' + counts;
      return '<details class="subject" data-subject="' + s.id + '"' +
        (openIds && openIds.indexOf(s.id) >= 0 ? ' open' : '') + '><summary>' + esc(s.name) +
        '<span class="counts">' + counts + '</span></summary><div class="topics">' +
        mine.map(function (t) {
          return '<button class="topic st-' + t.status + '" data-topic="' + t.id +
            '" aria-label="' + esc(t.name + ' — ' + t.status + ', tap to advance') + '">' +
            esc(t.name) + '</button>';
        }).join('') + '</div></details>';
    }).join('');
  }

  // ---- pomodoro: 25 focus / 5 break, visual only, one at a time ----
  var pomo = null;
  function pomoTick() {
    if (!pomo) return;
    var left = Math.max(0, Math.round((pomo.endsAt - Date.now()) / 1000));
    if (left === 0) {
      pomo.phase = pomo.phase === 'focus' ? 'break' : 'focus';
      pomo.endsAt = Date.now() + (pomo.phase === 'focus' ? 25 : 5) * 60000;
    }
    var mm = Math.floor(left / 60), ss = (left % 60 < 10 ? '0' : '') + (left % 60);
    // update text only — replacing the DOM each tick would yank the stop button mid-tap
    $('#pomo-phase').textContent = pomo.phase === 'focus' ? 'Focus' : 'Break';
    $('#pomo-time').textContent = mm + ':' + ss;
    document.title = mm + ':' + ss + ' · Triage';
  }
  function startPomo(label) {
    stopPomo();
    pomo = { phase: 'focus', endsAt: Date.now() + 25 * 60000, label: label,
      timer: setInterval(pomoTick, 500) };
    $('#pomobar').innerHTML = '<b id="pomo-phase"></b><span id="pomo-time"></span>' +
      '<span class="pomo-label">' + esc(label) + '</span>' +
      '<button type="button" id="pomo-stop">stop</button>';
    $('#pomobar').hidden = false;
    pomoTick();
  }
  function stopPomo() {
    if (!pomo) return;
    clearInterval(pomo.timer);
    pomo = null;
    $('#pomobar').hidden = true;
    document.title = 'Triage — adaptive study scheduler';
  }

  var lastTab = null;
  function render() {
    document.querySelectorAll('#tabs button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.tab === cur.tab);
    });
    var open = [].map.call(document.querySelectorAll('details.subject[open]'), function (d) {
      return d.dataset.subject;
    });
    $('#view').innerHTML = cur.tab === 'today' ? renderToday()
      : cur.tab === 'log' ? renderLog() : renderSubjects(open);
    if (cur.tab === 'today' && lastTab !== 'today') { // land on the current block
      var nb = $('.block.now');
      if (nb) nb.scrollIntoView({ block: 'center' });
    }
    lastTab = cur.tab;
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target : e.target.parentElement;
    var hit = function (s) { return el.closest(s); };
    var tab = hit('#tabs button');
    if (tab) { cur.tab = tab.dataset.tab; render(); return; }
    if (hit('#prev-day')) { cur.offset--; render(); return; }
    if (hit('#next-day')) { cur.offset++; render(); return; }
    if (hit('#day-label')) { cur.offset = 0; render(); return; }
    var chip = hit('#test-topics .chip');
    if (chip) { chip.classList.toggle('on'); return; }
    var pb = hit('.pomo-btn');
    if (pb) { startPomo(pb.dataset.label); return; }
    if (hit('#pomo-stop')) { stopPomo(); return; }
    if (hit('#export-btn')) {
      var blob = new Blob([JSON.stringify(state)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'triage-backup-' + todayISO() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      return;
    }
    var dg = hit('[data-del-grade]');
    if (dg) {
      state.grades = state.grades.filter(function (g) { return g.id !== dg.dataset.delGrade; });
      save(); render(); return;
    }
    var dt = hit('[data-del-test]');
    if (dt) {
      state.tests = state.tests.filter(function (t) { return t.id !== dt.dataset.delTest; });
      save(); render(); return;
    }
    var top = hit('.topic');
    if (top) {
      var t = state.topics.find(function (x) { return x.id === top.dataset.topic; });
      t.status = ORDER[(ORDER.indexOf(t.status) + 1) % 4];
      t.reviewDue = t.status === 'solid' ? Engine.addDays(todayISO(), 21) : null;
      save(); render();
    }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.classList && el.classList.contains('tick')) {
      var key = el.dataset.key;
      var logged = state.log.some(function (x) { return x.key === key; });
      if (el.checked && !logged) {
        var date = Engine.addDays(todayISO(), cur.offset);
        var block = Engine.buildDay(state, date).find(function (b) { return b.key === key; });
        if (block) Engine.tickBlock(state, block);
      } else if (!el.checked && logged) Engine.untickBlock(state, key);
      save(); render(); return;
    }
    if (el.id === 'import-file') {
      var file = el.files && el.files[0];
      if (!file) return;
      var rd = new FileReader();
      rd.onload = function () {
        var s2;
        try { s2 = JSON.parse(rd.result); } catch (err) { alert('Not a valid backup file.'); return; }
        if (!s2 || s2.version !== 1) { alert('Not a Triage backup.'); return; }
        if (!confirm('Replace everything on this device with this backup?')) return;
        state = normalize(s2);
        save(); render();
      };
      rd.readAsText(file);
      return;
    }
    if (el.id === 'floor-toggle') { state.settings.floorMode = el.checked; save(); return; }
    if (el.id === 'sat-toggle') { state.settings.satDone = el.checked; save(); return; }
    if (el.name === 'subject' && el.closest('#test-form')) $('#test-topics').innerHTML = chipsFor(el.value);
  });

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.id === 'grade-form') {
      state.grades.push({
        id: 'g' + Date.now(), subjectId: f.subject.value, date: f.date.value,
        score: +f.score.value, note: f.note.value.trim()
      });
    } else if (f.id === 'test-form') {
      state.tests.push({
        id: 't' + Date.now(), subjectId: f.subject.value, date: f.date.value,
        topicIds: [].map.call(f.querySelectorAll('.chip.on'), function (c) { return c.dataset.topic; }),
        note: f.note.value.trim()
      });
    } else return;
    save(); render();
  });

  render();
})();
</script>
</body>
</html>
